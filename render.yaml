services:
  - type: web
    name: amor-regius-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: amor-regius-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: VOTE_PRICE_GHS
        sync: false
      - key: TICKET_SINGLE_PRICE_GHS
        sync: false
      - key: TICKET_DOUBLE_PRICE_GHS
        sync: false
      - key: TICKET_EXECUTIVE_PRICE_GHS
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
